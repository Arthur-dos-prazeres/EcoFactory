<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Máquina | Gestão de Máquinas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #17243a;
        }

        /* =========================
           ESTRUTURA
        ========================= */

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           MENU LATERAL
        ========================= */

        .sidebar {
            width: 280px;
            min-height: 100vh;
            background: #0d203b;
            color: white;
            padding: 30px 15px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 0 15px;
            margin-bottom: 50px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            background: white;
            color: #0d203b;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
        }

        .logo h2 {
            font-size: 19px;
            white-space: nowrap;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;

            display: flex;
            align-items: center;
            gap: 15px;

            font-size: 16px;

            transition: 0.2s;
        }

        .menu a:hover {
            background: #18365e;
        }

        .menu a.active {
            background: #1463e8;
        }

        .menu-icon {
            width: 25px;
            text-align: center;
            font-size: 20px;
        }

        .logout {
            margin-top: auto;
        }

        /* =========================
           CONTEÚDO
        ========================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* =========================
           HEADER
        ========================= */

        .header {
            height: 80px;
            background: white;
            border-bottom: 1px solid #e1e5eb;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding: 0 35px;
            gap: 25px;
        }

        .notification {
            font-size: 25px;
            cursor: pointer;
        }

        .user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #e1e5eb;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 20px;
        }

        /* =========================
           ÁREA DA PÁGINA
        ========================= */

        .content {
            padding: 35px 42px;
            flex: 1;
        }

        .title {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .breadcrumb {
            display: flex;
            gap: 14px;
            margin-bottom: 30px;
            font-size: 17px;
        }

        .breadcrumb .blue {
            color: #1463e8;
        }

        .breadcrumb .gray {
            color: #6d788b;
        }

        /* =========================
           CARD DO FORMULÁRIO
        ========================= */

        .card {
            background: white;
            border: 1px solid #dfe4ea;
            border-radius: 10px;

            padding: 30px 26px;

            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
        }

        .card h2 {
            font-size: 24px;
            margin-bottom: 35px;
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px 25px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 11px;
        }

        .required {
            color: #e53935;
        }

        input,
        select {
            width: 100%;
            height: 58px;

            padding: 0 16px;

            border: 1px solid #ccd4df;
            border-radius: 8px;

            background: white;

            color: #526074;
            font-size: 16px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #1463e8;
            box-shadow: 0 0 0 2px rgba(20, 99, 232, 0.12);
        }

        /* =========================
           INPUT COM UNIDADE
        ========================= */

        .input-unit {
            display: flex;
            width: 100%;
        }

        .input-unit input {
            border-radius: 8px 0 0 8px;
        }

        .unit {
            width: 70px;
            height: 58px;

            background: #eef1f5;

            border: 1px solid #ccd4df;
            border-left: none;

            border-radius: 0 8px 8px 0;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #596579;
        }

        /* =========================
           BOTÕES
        ========================= */

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 20px;

            margin-top: 45px;
        }

        button {
            height: 55px;
            padding: 0 35px;

            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel {
            background: white;
            color: #17243a;

            border: 1px solid #ccd4df;
        }

        .btn-cancel:hover {
            background: #f1f3f6;
        }

        .btn-save {
            background: #1463e8;
            color: white;

            border: none;
        }

        .btn-save:hover {
            background: #0d54cc;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            height: 60px;

            background: white;
            border-top: 1px solid #e1e5eb;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #68758a;
            font-size: 14px;
        }

        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 1100px) {

            .sidebar {
                width: 230px;
            }

            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 750px) {

            .sidebar {
                display: none;
            }

            .content {
                padding: 25px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 0 20px;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         SIDEBAR
    ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                ⚙
            </div>

            <h2>
                Gestão de Máquinas
            </h2>

        </div>


        <nav class="menu">

            <a href="#">
                <span class="menu-icon">⌂</span>
                Dashboard
            </a>

            <a href="#" class="active">
                <span class="menu-icon">▣</span>
                Máquinas
            </a>

            <a href="#">
                <span class="menu-icon">▥</span>
                Relatórios
            </a>

            <a href="#">
                <span class="menu-icon">🛠</span>
                Manutenções
            </a>

            <a href="#">
                <span class="menu-icon">♧</span>
                Alertas
            </a>

            <a href="#">
                <span class="menu-icon">⚙</span>
                Configurações
            </a>

        </nav>


        <nav class="menu logout">

            <a href="#">
                <span class="menu-icon">⇥</span>
                Sair
            </a>

        </nav>

    </aside>


    <!-- =========================
         ÁREA PRINCIPAL
    ========================= -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <div class="notification">
                ♧
            </div>

            <div class="user">

                <div class="avatar">
                    👤
                </div>

                <span>⌄</span>

            </div>

        </header>


        <!-- CONTEÚDO -->

        <section class="content">

            <h1 class="title">
                Nova Máquina
            </h1>


            <div class="breadcrumb">

                <span class="blue">
                    Máquinas
                </span>

                <span>
                    ›
                </span>

                <span class="gray">
                    Nova Máquina
                </span>

            </div>


            <!-- CARD -->

            <div class="card">

                <h2>
                    Dados da máquina
                </h2>


                <form id="machineForm">

                    <div class="form-grid">

                        <!-- NOME -->

                        <div class="field">

                            <label>
                                Nome da máquina
                                <span class="required">*</span>
                            </label>

                            <input
                                type="text"
                                id="nome"
                                placeholder="Ex.: Torno CNC 01"
                                required
                            >

                        </div>


                        <!-- SETOR -->

                        <div class="field">

                            <label>
                                Setor
                                <span class="required">*</span>
                            </label>

                            <select id="setor" required>

                                <option value="">
                                    Selecione o setor
                                </option>

                                <option value="Produção">
                                    Produção
                                </option>

                                <option value="Usinagem">
                                    Usinagem
                                </option>

                                <option value="Montagem">
                                    Montagem
                                </option>

                                <option value="Manutenção">
                                    Manutenção
                                </option>

                                <option value="Expedição">
                                    Expedição
                                </option>

                            </select>

                        </div>


                        <!-- TIPO -->

                        <div class="field">

                            <label>
                                Tipo
                                <span class="required">*</span>
                            </label>

                            <select id="tipo" required>

                                <option value="">
                                    Selecione o tipo
                                </option>

                                <option value="Torno CNC">
                                    Torno CNC
                                </option>

                                <option value="Fresa">
                                    Fresa
                                </option>

                                <option value="Prensa">
                                    Prensa
                                </option>

                                <option value="Esteira">
                                    Esteira
                                </option>

                                <option value="Robô Industrial">
                                    Robô Industrial
                                </option>

                                <option value="Compressor">
                                    Compressor
                                </option>

                            </select>

                        </div>


                        <!-- STATUS -->

                        <div class="field">

                            <label>
                                Status
                                <span class="required">*</span>
                            </label>

                            <select id="status" required>

                                <option value="">
                                    Selecione o status
                                </option>

                                <option value="Em operação">
                                    Em operação
                                </option>

                                <option value="Em manutenção">
                                    Em manutenção
                                </option>

                                <option value="Parada">
                                    Parada
                                </option>

                                <option value="Desativada">
                                    Desativada
                                </option>

                            </select>

                        </div>


                        <!-- CONSUMO -->

                        <div class="field">

                            <label>
                                Consumo médio de energia
                                <span class="required">*</span>
                            </label>

                            <div class="input-unit">

                                <input
                                    type="number"
                                    id="consumo"
                                    placeholder="Ex.: 12,5"
                                    min="0"
                                    step="0.1"
                                    required
                                >

                                <div class="unit">
                                    kWh
                                </div>

                            </div>

                        </div>


                        <!-- TEMPERATURA -->

                        <div class="field">

                            <label>
                                Temperatura atual
                                <span class="required">*</span>
                            </label>

                            <div class="input-unit">

                                <input
                                    type="number"
                                    id="temperatura"
                                    placeholder="Ex.: 45"
                                    step="0.1"
                                    required
                                >

                                <div class="unit">
                                    °C
                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- BOTÕES -->

                    <div class="actions">

                        <button
                            type="button"
                            class="btn-cancel"
                            onclick="cancelar()"
                        >
                            Cancelar
                        </button>


                        <button
                            type="submit"
                            class="btn-save"
                        >
                            Salvar
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- FOOTER -->

        <footer>
            © 2026 Gestão de Máquinas. Todos os direitos reservados.
        </footer>

    </main>

</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script>

    const formulario = document.getElementById("machineForm");

    formulario.addEventListener("submit", async function(event) {
        event.preventDefault();

        const maquina = {
            nome: document.getElementById("nome").value.trim(),
            setor: document.getElementById("setor").value,
            tipo: document.getElementById("tipo").value,
            status: document.getElementById("status").value,
            consumo_medio_energia: Number(document.getElementById("consumo").value),
            temperatura_atual: Number(document.getElementById("temperatura").value)
        };

        try {
            const resposta = await fetch("/api/maquinas", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(maquina)
            });

            const dados = await resposta.json();

            if (!resposta.ok) {
                throw new Error(dados.erro || "Não foi possível cadastrar a máquina.");
            }

            alert("Máquina cadastrada com sucesso!");
            formulario.reset();
        } catch (erro) {
            console.error(erro);
            alert("Erro ao cadastrar máquina: " + erro.message);
        }
    });

    function cancelar() {
        const confirmar = confirm("Deseja cancelar o cadastro da máquina?");
        if (confirmar) formulario.reset();
    }
</script>

</body>
</html>
