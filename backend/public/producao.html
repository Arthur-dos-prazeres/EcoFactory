<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Produção - EcoFactor</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172b4d}.main{max-width:1200px;margin:auto;padding:30px}.top,.card{background:#fff;border:1px solid #dce2e9;border-radius:10px;padding:22px;margin-bottom:20px}.top h1{margin:0 0 6px}.top p{color:#667085}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form input,.form select{padding:11px;border:1px solid #ccd4df;border-radius:6px}.btn{background:#0868ed;color:white;border:0;padding:11px 16px;border-radius:6px;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e7ebf0;text-align:left;font-size:13px}th{color:#0868ed;background:#f5f8fc}@media(max-width:800px){.form{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><main class="main"><section class="top"><h1>Cadastro e Consulta de Produção</h1><p>Os registros são enviados para a API e armazenados no PostgreSQL.</p><a class="btn" href="/">Dashboard</a> <a class="btn" href="/consulta.html">Máquinas</a></section><section class="card"><form id="form" class="form"><select id="maquina" required><option value="">Selecione a máquina</option></select><input id="produto" placeholder="Produto" required><input id="quantidade" type="number" min="0" placeholder="Quantidade produzida" required><input id="rejeitada" type="number" min="0" value="0" placeholder="Rejeitadas"><input id="data" type="date" required><select id="turno"><option value="Manhã">Manhã</option><option value="Tarde">Tarde</option><option value="Noite">Noite</option></select><button class="btn" type="submit">Salvar produção</button></form><p id="msg"></p></section><section class="card"><table><thead><tr><th>Data</th><th>Máquina</th><th>Produto</th><th>Produzido</th><th>Rejeitado</th><th>Turno</th></tr></thead><tbody id="lista"></tbody></table></section></main><script>async function carregar(){const [mr,pr]=await Promise.all([fetch('/api/maquinas'),fetch('/api/producao')]);const m=await mr.json(),p=await pr.json();document.getElementById('maquina').innerHTML='<option value="">Selecione a máquina</option>'+m.map(x=>`<option value="${x.id}">${x.nome}</option>`).join('');document.getElementById('lista').innerHTML=p.map(x=>`<tr><td>${x.data_producao}</td><td>${x.maquina}</td><td>${x.produto}</td><td>${x.quantidade_produzida}</td><td>${x.quantidade_rejeitada}</td><td>${x.turno||'-'}</td></tr>`).join('')||'<tr><td colspan="6">Nenhuma produção cadastrada.</td></tr>'}document.getElementById('data').value=new Date().toISOString().slice(0,10);document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const body={maquina_id:Number(maquina.value),produto:produto.value,quantidade_produzida:Number(quantidade.value),quantidade_rejeitada:Number(rejeitada.value),data_producao:data.value,turno:turno.value};const r=await fetch('/api/producao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();msg.textContent=r.ok?d.mensagem:d.erro;msg.style.color=r.ok?'green':'red';if(r.ok){e.target.reset();data.value=new Date().toISOString().slice(0,10);await carregar()}});document.addEventListener('DOMContentLoaded',carregar);</script></body></html>
